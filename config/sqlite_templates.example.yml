delete_marker_sql: |
  -- Example only.
  DELETE FROM Chapters3
  WHERE ItemId = :item_id
    AND MarkerType IN (:intro_start_marker, :intro_end_marker);

insert_marker_sql: |
  -- Example only.
  INSERT INTO Chapters3 (
    ItemId,
    StartPositionTicks,
    MarkerType,
    Name
  ) VALUES (
    :item_id,
    :start_ticks,
    :marker_type,
    :name
  );
